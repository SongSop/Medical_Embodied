ekf_filter_node:
  ros__parameters:
    # 与仿真链路保持一致：底盘原始里程计 + IMU -> EKF -> /odom + odom->base_footprint
    frequency: 50.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 订阅底盘原始里程计
    odom0: odom/unfiltered
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    # 保留轮速作为短时速度先验，但靠协方差降低其在打滑场景下的话语权

    # 订阅 FastLIO 预处理后的相对里程计：
    # 该话题来自 xjrobot_fastlio_relative_odom，将 /odom_fastlio 的连续位姿转为平面相对位移
    odom1: /odom_fastlio_relative
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_relative: false

    # 订阅 IMU，仅使用角速度 z 做平面姿态约束
    imu0: /livox/imu_rotated
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
