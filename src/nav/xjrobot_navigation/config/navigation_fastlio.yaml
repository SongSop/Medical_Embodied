# ======================= xjrobot Nav2 3D FastLIO 配置说明 =======================
# 1) 本文件由 navigation.yaml 复制并改造，专门用于：
#    - 3D 雷达建图/定位
#    - FAST_LIO_LOCALIZATION2 提供定位结果
#    - navigation_fastlio.launch.py 启动 Nav2
#
# 2) 与原始 2D 版本 navigation.yaml 的核心区别：
#    - 原版依赖 2D 激光 /scan，并默认可兼容 AMCL 这一类 2D 激光定位链路
#    - 本版不依赖 2D 激光定位，定位来源换成 FAST_LIO_LOCALIZATION2
#    - 本版的代价地图观测源从 LaserScan 改成 3D 点云 PointCloud2
#    - 本版由 xjrobot_localization/map_odom_tf_publisher 把 FASTLIO 的坐标系桥接成 Nav2 需要的 map->odom
#
# 3) 当前整体 TF 关系：
#    FASTLIO内部: map_fastlio -> odom_fastlio -> base_link_fastlio
#    对外导航树: map -> odom -> base_footprint -> base_link
#    其中 Nav2 的平面导航语义更适合绑定 base_footprint，
#    这样可以尽量屏蔽 3D 定位链路中可能引入的 roll / pitch 扰动
#
# 4) 当前话题约定：
#    - 全局地图服务: /map
#    - 导航里程计: /odom
#    - Ground segmentation 障碍点云: /ground_segmentation/obstacle_points
#    - 导航障碍观测 LaserScan: /scan
#    - 速度控制: /cmd_vel
#
# 5) 注意：
#    - navigation_fastlio.launch.py 已设置 use_localization=False，因此不会启动 AMCL
#    - 所以本文件里不再保留 amcl 参数块，避免与 2D 版配置混淆
#    - 如果后续修改 scan 输出话题，需要同步修改本文件中的 /scan 引用
# ===============================================================================

# 行为树导航器：负责串联“规划-跟踪-恢复”整条导航执行链
bt_navigator:
  ros__parameters:
    global_frame: &map_frame map         # Nav2 全局坐标系
    # 与 2D 版靠拢：导航行为树使用 base_footprint 作为平面机器人基准帧
    robot_base_frame: &base_frame base_footprint
    odom_topic: /odom                    # 控制与局部规划依赖的里程计话题
    bt_loop_duration: 10                 # 行为树循环周期，单位 ms
    default_server_timeout: 20           # 等待 action/service 响应的默认超时，单位 s
    wait_for_service_timeout: 1000       # 等待服务可用超时，单位 ms
    action_server_result_timeout: 900.0  # 等待 action 结果的超时，单位 s
    navigators: ["navigate_to_pose", "navigate_through_poses"]  # 启用的导航器类型
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"       # 单目标点导航
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator" # 多目标点导航
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# 控制器：负责跟踪全局路径并输出底盘速度
controller_server:
  ros__parameters:
    controller_frequency: 20.0           # 控制器运行频率，Hz
    costmap_update_timeout: 0.30         # 等待代价地图更新超时，s
    min_x_velocity_threshold: 0.001      # 线速度过小阈值，低于此值视作 0
    min_y_velocity_threshold: 0.5        # 差速机器人不使用 y 向速度，这里保持模板值
    min_theta_velocity_threshold: 0.001  # 角速度过小阈值
    failure_tolerance: 0.3               # 控制失败容忍时间/距离的内部阈值
    progress_checker_plugins: ["progress_checker"]   # 进展检测插件
    goal_checker_plugins: ["general_goal_checker"]   # 目标到达检测插件
    controller_plugins: ["FollowPath"]               # 启用的局部控制器
    use_realtime_priority: false                     # 是否使用实时线程优先级

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5      # 在指定时间内至少移动这么远，才认为有进展
      movement_time_allowance: 10.0      # 允许停滞的时间，s

    general_goal_checker:
      stateful: True                     # 到达目标后保持状态，有助于减小振荡
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35            # 到目标点的平面位置容差，m
      yaw_goal_tolerance: 0.35           # 到目标朝向的角度容差，rad

    FollowPath:
      # 与原版相同：仍使用 RotationShim + RPP 的组合控制器
      # 差异不在控制器本身，而在定位和障碍物观测链路改成了 3D 方案
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785      # 偏航角大于此阈值时先原地转向
      angular_disengage_threshold: 0.3925
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.8
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: true
      use_path_orientations: false
      desired_linear_vel: 0.4            # 期望巡航线速度，m/s
      lookahead_dist: 0.6                # 纯跟踪前视距离，m
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.1           # TF 可接受延迟，s
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true      # 控制器内启用前向碰撞检查
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_rotate_to_heading: true
      allow_reversing: false             # 当前默认不允许倒车
      rotate_to_heading_min_angle: 0.785
      max_robot_pose_search_dist: 10.0
      stateful: true

# 局部代价地图：跟随机器人滚动，用于局部避障与控制
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0              # 局部代价地图更新频率，Hz
      publish_frequency: 2.0             # 局部代价地图发布频率，Hz
      global_frame: &odom_frame odom     # 局部图一般挂在 odom 下，避免 map 抖动影响控制
      # 3D 定位输入下，局部代价地图仍然是平面代价地图，因此改用 base_footprint 更稳
      robot_base_frame: *base_frame
      rolling_window: true               # 开启滚动窗口
      width: 5                           # 局部地图宽度，m
      height: 5                          # 局部地图高度，m
      resolution: 0.05                  # 分辨率，m/cell
      # 使用显式 footprint 而不是近似 robot_radius：
      # 这样 ObstacleLayer 在 footprint clearing 时能更准确地清除自车投影
      footprint: &robot_footprint "[[0.28, 0.26], [0.28, -0.26], [-0.28, -0.26], [-0.28, 0.26]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0         # 膨胀代价衰减速度
        inflation_radius: 0.80           # 障碍物膨胀半径，m
      obstacle_layer:
        # 不再让 Nav2 内部做 3D->2D 投影，而是先转成 /scan 后按标准 2D 激光配置处理。
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True # 清除机器人足迹内部障碍，避免把机器人本体标成障碍
        observation_sources: scan
        scan:
          topic: &scan_topic /scan
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          marking: True
          clearing: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      always_send_full_costmap: True     # 每次发布完整代价地图

# 全局代价地图：基于 map 构建，结合静态地图与实时障碍
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0              # 全局图更新频率通常低于局部图
      publish_frequency: 1.0
      global_frame: *map_frame
      # 全局代价地图同样使用平面基准帧，避免机体俯仰影响机器人投影
      robot_base_frame: *base_frame
      footprint: *robot_footprint
      footprint_padding: 0.03
      resolution: 0.05
      track_unknown_space: true          # 保留未知区域信息
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        # 全局图同样统一使用 /scan，避免 3D 点云标记/清除逻辑带来的残影累积。
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: *scan_topic
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          marking: True
          clearing: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True  # 兼容 map_server 的 transient_local QoS
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True

# 地图保存器：用于运行时把地图重新保存为 pgm/yaml
map_saver:
  ros__parameters:
    save_map_timeout: 5.0                # 保存地图超时，s
    free_thresh_default: 0.25            # 自由空间阈值
    occupied_thresh_default: 0.65        # 占用空间阈值
    map_subscribe_transient_local: True

# 全局规划器：根据全局代价地图求路径
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0     # 期望规划频率，Hz
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5                     # 到目标点附近多少米内允许找到最近可达点
      use_astar: false                   # false 为 Dijkstra，true 为 A*
      allow_unknown: true                # 是否允许穿越未知区域

# 平滑器：对规划路径做轻量平滑
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# 恢复行为服务器：负责原地转向、后退、等待等行为
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: *odom_frame
    global_frame: *map_frame
    # 恢复行为也按平面底盘执行，统一使用 base_footprint
    robot_base_frame: *base_frame
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# 路点跟随器：多点巡航时使用
waypoint_follower:
  ros__parameters:
    loop_rate: 20                        # 路点处理循环频率，Hz
    stop_on_failure: false               # 某个点失败后是否整体终止
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200       # 到点后停留时间，ms

# 速度平滑器：对控制器输出的速度进一步做滤波和限幅
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0            # 平滑频率，Hz
    scale_velocities: False
    feedback: "OPEN_LOOP"                # 开环速度平滑
    max_velocity: [0.5, 0.0, 2.5]        # 最大速度 [vx, vy, wz]
    min_velocity: [-0.5, 0.0, -2.5]      # 最小速度 [vx, vy, wz]
    max_accel: [2.5, 0.0, 3.2]           # 最大加速度
    max_decel: [-2.5, 0.0, -3.2]         # 最大减速度
    odom_topic: *odom_frame
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]   # 死区速度
    velocity_timeout: 1.0                # 超时未收到速度则置零

# 碰撞监视器：在控制链末端做最后一道安全限制
collision_monitor:
  ros__parameters:
    base_frame_id: *base_frame           # 与 2D 版一致，使用 base_footprint 更稳定
    odom_frame_id: *odom_frame
    cmd_vel_in_topic: "cmd_vel_smoothed" # 输入为速度平滑器输出
    cmd_vel_out_topic: "cmd_vel"         # 输出给底盘控制
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["obstacle_points"]
    obstacle_points:
      type: "scan"
      topic: *scan_topic
      enabled: True

# 停靠服务：目前保持模板参数，只做简要说明
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: &body_frame "base_link"
    fixed_frame: *odom_frame
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

# loopback_simulator：主要给 Nav2 自带的一些测试/模拟接口保留参数
loopback_simulator:
  ros__parameters:
    base_frame_id: *base_frame
    odom_frame_id: *odom_frame
    map_frame_id: *map_frame
    # 与 2D 版不同：扫描帧不再是 lidar_2d_link，而改成 3D 雷达安装帧
    scan_frame_id: "lidar_3d_link"
    update_duration: 0.02
