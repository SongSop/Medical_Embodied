# ======================= xjrobot Nav2 FastLIO 实机导航配置 =======================
# 用途：
# - 定位来源：FAST_LIO_LOCALIZATION2
# - 导航入口：navigation_expr.launch.py
# - 障碍物观测：ground_segmentation -> pointcloud_to_laserscan -> /scan
#
# 关键 TF 语义：
# - 定位内部链：map_fastlio -> odom_fastlio -> base_link_fastlio
# - 对外导航链：map -> odom -> base_footprint -> base_link
# - Nav2 统一使用 base_footprint 作为平面机器人基准帧，尽量隔离 3D 姿态扰动
#
# 关键话题：
# - /map：全局地图
# - /odom：导航里程计
# - /scan：供 costmap 使用的 2D LaserScan
# - /cmd_vel_nav：Nav2 原始控制输出
# - /cmd_vel_smoothed：速度平滑后的中间输出
# - /cmd_vel_safe：最终下发到底盘的安全速度
# ===============================================================================

# 行为树导航器：串联规划、跟踪、恢复等导航动作
bt_navigator:
  ros__parameters:
    global_frame: map         # Nav2 全局参考系
    robot_base_frame: base_footprint
    odom_topic: /odom                    # 控制与局部规划依赖的里程计
    bt_loop_duration: 10                 # 行为树循环周期，ms
    default_server_timeout: 20           # action/service 默认超时，s
    wait_for_service_timeout: 1000       # 等待服务可用超时，ms
    action_server_result_timeout: 900.0  # 等待 action 结果超时，s
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# 控制器：跟踪路径并输出底盘速度
controller_server:
  ros__parameters:
    controller_frequency: 20.0           # 控制频率，Hz
    costmap_update_timeout: 0.30         # 等待代价地图更新超时，s
    min_x_velocity_threshold: 0.001      # 小于此值的 vx 视作 0
    min_y_velocity_threshold: 0.5        # 差速底盘不使用 y 向速度
    min_theta_velocity_threshold: 0.001  # 小于此值的角速度视作 0
    failure_tolerance: 0.3               # 控制失败容忍阈值
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5      # 指定时间内至少移动这么远才算有进展
      movement_time_allowance: 10.0      # 允许停滞时间，s

    general_goal_checker:
      stateful: True                     # 到点后保持状态，减少振荡
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35            # 平面位置容差，m
      yaw_goal_tolerance: 0.35           # 朝向容差，rad

    FollowPath:
      # 采用 RotationShim + RPP 组合控制器
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785      # 偏航过大时先原地转向
      angular_disengage_threshold: 0.3925
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: true
      use_path_orientations: false
      desired_linear_vel: 0.2            # 巡航线速度，m/s
      lookahead_dist: 0.6                # 前视距离，m
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.1           # TF 容忍延迟，s
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true      # 控制器内部碰撞检查
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_rotate_to_heading: true
      allow_reversing: false             # 当前不允许倒车
      rotate_to_heading_min_angle: 0.785
      max_robot_pose_search_dist: 10.0
      stateful: true

# 局部代价地图：滚动窗口，服务于局部避障与控制
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0             # 更新频率，Hz
      publish_frequency: 10.0            # 发布频率，Hz
      transform_tolerance: 0.3           # 放宽 TF 容忍度，降低实机链路抖动导致的丢观测
      global_frame: odom                 # 局部图挂在 odom 下，避免 map 抖动影响控制
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5                           # 局部地图宽度，m
      height: 5                          # 局部地图高度，m
      resolution: 0.05                  # 分辨率，m/cell
      # 改为圆形底盘模型：由 robot_radius 决定碰撞轮廓
      robot_radius: 0.25
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0         # 膨胀代价衰减速度
        inflation_radius: 0.80           # 障碍膨胀半径，m
      obstacle_layer:
        # 本地障碍物输入统一来自 /scan
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True # 清除机器人足迹内部障碍
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          tf_filter_tolerance: 0.3
          marking: True
          clearing: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      always_send_full_costmap: True     # 始终发布完整 costmap

# 全局代价地图：静态地图 + 实时障碍
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0              # 全局图更新频率通常低于局部图
      publish_frequency: 5.0
      transform_tolerance: 0.3           # 全局图更依赖 map->odom，放宽容忍度避免静态化
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true          # 保留未知区域
      plugins: ["obstacle_layer", "inflation_layer"]
      rolling_window: true
      width: 20.0                         
      height: 20.0 
      obstacle_layer:
        # 全局图同样使用 /scan 作为实时障碍输入
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          tf_filter_tolerance: 0.3
          marking: True
          clearing: False
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True  # 兼容 map_server 的 transient_local QoS
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.8
      always_send_full_costmap: True

# 地图保存器：运行时保存地图
map_saver:
  ros__parameters:
    save_map_timeout: 5.0                # 保存地图超时，s
    free_thresh_default: 0.25            # 自由空间阈值
    occupied_thresh_default: 0.65        # 占用空间阈值
    map_subscribe_transient_local: True

# 全局规划器：依据全局代价地图求路径
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0     # 期望规划频率，Hz
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5                     # 目标点附近允许落到最近可达点的距离
      use_astar: false                   # false 为 Dijkstra，true 为 A*
      allow_unknown: false               # 是否允许穿越未知区域

# 平滑器：对规划路径做轻量平滑
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# 恢复行为服务器：负责原地转向、后退、等待等恢复动作
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame:  odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# 路点跟随器：用于多目标点导航
waypoint_follower:
  ros__parameters:
    loop_rate: 20                        # 路点处理循环频率，Hz
    stop_on_failure: false               # 单点失败后是否整体终止
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200       # 到点后停留时间，ms

# 速度平滑器：对控制器输出速度做限幅与滤波
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0            # 平滑频率，Hz
    scale_velocities: False
    feedback: "OPEN_LOOP"                # 开环速度平滑
    max_velocity: [0.3, 0.0, 1.0]        # 最大速度 [vx, vy, wz]
    min_velocity: [-0.2, 0.0, -1.0]      # 最小速度 [vx, vy, wz]
    max_accel: [0.8, 0.0, 1.5]           # 最大加速度
    max_decel: [-0.8, 0.0, -1.5]         # 最大减速度
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]   # 死区速度
    velocity_timeout: 1.0                # 超时未收到速度则置零

# 碰撞监视器：控制链末端的最后一道安全限制
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: "cmd_vel_smoothed" # 输入为速度平滑器输出
    cmd_vel_out_topic: "cmd_vel_safe"    # 最终安全速度输出，供底盘控制节点订阅
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["obstacle_points"]
    obstacle_points:
      # 保持与 costmap 一致，统一消费 /scan
      type: "scan"
      topic: /scan
      enabled: True

# 停靠服务：当前沿用模板参数
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

# loopback_simulator：保留 Nav2 自带测试/模拟接口所需参数
loopback_simulator:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    map_frame_id: map
    # 这里使用 3D 雷达安装帧
    scan_frame_id: "lidar_3d_link"
    update_duration: 0.02
