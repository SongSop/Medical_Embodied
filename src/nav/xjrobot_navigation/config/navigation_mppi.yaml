# ==================== xjrobot Nav2 FastLIO 实机 MPPI 导航配置 ====================
# 用途：
# - 定位来源：FAST_LIO_LOCALIZATION2
# - 导航入口：navigation_mppi.launch.py
# - 障碍物观测：ground_segmentation -> pointcloud_to_laserscan -> /scan
#
# 关键 TF 语义：
# - 定位内部链：map_fastlio -> odom_fastlio -> base_link_fastlio
# - 对外导航链：map -> odom -> base_footprint -> base_link
# - Nav2 统一使用 base_footprint 作为平面机器人基准帧，尽量隔离 3D 姿态扰动
#
# 关键话题：
# - /map：全局地图
# - /odom：导航里程计
# - /scan：供 costmap 使用的 2D LaserScan
# - /cmd_vel_nav：Nav2 原始控制输出
# - /cmd_vel_smoothed：速度平滑后的中间输出
# - /cmd_vel_safe：最终下发到底盘的安全速度
# ===============================================================================

# 行为树导航器：串联规划、跟踪、恢复等导航动作
bt_navigator:
  ros__parameters:
    global_frame: map         # Nav2 全局参考系
    robot_base_frame: base_footprint
    odom_topic: /odom                    # 控制与局部规划依赖的里程计
    bt_loop_duration: 10                 # 行为树循环周期，ms
    default_server_timeout: 20           # action/service 默认超时，s
    wait_for_service_timeout: 1000       # 等待服务可用超时，ms
    action_server_result_timeout: 900.0  # 等待 action 结果超时，s
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# 控制器：RotationShim 负责自动原地转向，MPPI 负责局部轨迹优化与避障
controller_server:
  ros__parameters:
    controller_frequency: 20.0           # 控制频率，Hz
    costmap_update_timeout: 0.30         # 等待代价地图更新超时，s
    min_x_velocity_threshold: 0.001      # 小于此值的 vx 视作 0
    min_y_velocity_threshold: 0.5        # 差速底盘不使用 y 向速度
    min_theta_velocity_threshold: 0.001  # 小于此值的角速度视作 0
    failure_tolerance: 0.3               # 控制失败容忍阈值
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5      # 指定时间内至少移动这么远才算有进展
      movement_time_allowance: 10.0      # 允许停滞时间，s

    general_goal_checker:
      stateful: True                     # 到点后保持状态，减少振荡
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35            # 平面位置容差，m
      yaw_goal_tolerance: 0.35           # 朝向容差，rad

    FollowPath:
      # RotationShim 会在路径朝向差过大时先原地转向，目标点附近再自动对齐目标 yaw。
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 1.0      # 偏航过大时先原地转向
      angular_disengage_threshold: 0.75  # 早点交给 MPPI，避免原地转向过冲后再反向修正
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.45
      max_angular_accel: 0.8
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: true
      closed_loop: true                  # 使用 /odom 角速度闭环减速，降低起步转向过冲
      use_path_orientations: false

      # ==================== MPPI 核心采样与运动模型参数 ====================
      # 成熟配置常见基线：
      # - Nav2 官方示例：time_steps=56、model_dt=0.05、batch_size=2000、iteration_count=1。
      # - 实机差速配置常见预测窗约 2.8s；本车为了更早看到前方，略加长到 3.5s。
      # - 预测距离 = time_steps * model_dt * vx_max = 70 * 0.05 * 0.5 = 1.75m。
      #   局部 costmap 为 5m x 5m，机器人在中心时前向半径约 2.5m，因此该预测距离仍在可观测范围内。
      time_steps: 70                     # 预测离散步数；越大看得越远，但 CPU 与可视化开销线性增大
      model_dt: 0.05                     # 每步预测时间，s；20Hz controller_frequency 对应 0.05s，官方建议不要大于控制周期
      batch_size: 2000                   # 每周期采样轨迹数；成熟配置常用 1000~2000，越大越稳但越耗算力
      iteration_count: 1                 # 每周期优化迭代次数；Nav2 官方建议通常保持 1，避免控制周期延迟
      vx_max: 0.5                        # 最大前进速度，m/s；与底盘安全限速一致
      vx_min: 0.0                        # 最小 x 速度；0 表示禁止倒车，避免差速底盘倒车绕障带来不可控行为
      vy_max: 0.0                        # 横向速度；差速底盘必须为 0
      wz_max: 0.8                        # 最大角速度，rad/s；过大转弯更猛，过小会转不过急弯
      ax_max: 0.9                        # 最大前向加速度，m/s^2；限制速度突变，提升平滑性
      ax_min: -1.1                       # 最大减速度，m/s^2；绝对值略大于加速度，便于靠近障碍或目标时刹车
      ay_max: 0.0                        # 横向加速度；差速底盘不使用
      ay_min: 0.0                        # 横向减速度；差速底盘不使用
      az_max: 0.7                        # 最大角加速度，rad/s^2；越小起步/转弯越柔，但响应更慢
      vx_std: 0.25                       # 线速度采样标准差；约为 vx_max 的一半，能探索到高速候选轨迹
      vy_std: 0.0                        # 横向速度采样标准差；差速底盘必须为 0
      wz_std: 0.24                       # 角速度采样标准差；越大越容易找急转，越小转弯越平滑
      motion_model: "DiffDrive"          # 差速模型；AckermannConstraints 只对 Ackermann 模型生效
      temperature: 0.30                  # softmax 温度；成熟配置常用 0.3，低值更激进，高值更平均更平滑
      gamma: 0.015                       # 控制能量惩罚；成熟配置常用 0.015，增大会更保守更平滑
      prune_distance: 2.0                # 路径裁剪距离；应与预测距离接近或略大，保证 MPPI 有足够路径可跟
      transform_tolerance: 0.1           # TF 容忍时间，s；太大掩盖定位延迟，太小容易 TF 报错
      retry_attempt_limit: 1             # 优化失败重试次数；实机保持小值，避免卡在旧命令上太久
      regenerate_noises: false           # false 会复用噪声序列，输出更稳定；true 探索更随机但更容易抖
      visualize: true                    # 调参时可打开候选轨迹；实机长期运行建议 false，官方提示该项明显增加计算量
      TrajectoryVisualizer:
        trajectory_step: 12              # 每隔多少条候选轨迹发布一条到 RViz；越大显示越轻
        time_step: 3                     # 每条轨迹每隔多少个时间点显示一次；越大显示越稀疏
      AckermannConstraints:
        min_turning_r: 0.2               # 仅 Ackermann 模型使用；当前 DiffDrive 下不参与转弯半径约束

      critics: [
        "ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
        "PreferForwardCritic", "VelocityDeadbandCritic", "TwirlingCritic"]

      # 约束 critic：惩罚超过速度/加速度约束的候选轨迹，是 MPPI 的基础安全约束。
      ConstraintCritic:
        enabled: true
        cost_power: 1                    # 1 为线性惩罚；更高会让超限轨迹代价急剧增加
        cost_weight: 4.0                 # 官方示例值；通常无需频繁调整

      # 代价地图 critic：直接读取局部 costmap 的代价，负责碰撞和靠近障碍物的基础惩罚。
      # 与 ObstaclesCritic 同时开启时避障更强，但过高会导致速度降低或窄通道犹豫。
      CostCritic:
        enabled: true
        cost_power: 1                    # 线性代价，便于和 PathFollow/PathAlign 平衡
        cost_weight: 5.0                 # 略高于官方 3.81，增强实机避障
        critical_cost: 300.0             # 接近致命代价时额外惩罚
        collision_cost: 1000000.0        # 轨迹碰撞时的巨大惩罚，确保碰撞轨迹不会被选中
        near_collision_cost: 253         # 接近 INSCRIBED/LETHAL 区域时触发 critical_cost
        near_goal_distance: 0.6          # 距目标较近时减弱障碍偏好，避免目标附近卡住
        trajectory_point_step: 1         # 每个预测点都检查 costmap；避障更稳但计算更重
        consider_footprint: false        # 当前 costmap 使用 robot_radius 圆形模型，因此保持 false
        inflation_layer_name: "inflation_layer"  # 指定膨胀层名称，供 critic 获取膨胀参数

      # 障碍物 critic：根据膨胀层估算到障碍物距离，比 CostCritic 更适合调“离障碍远一点”。
      # 官方建议 repulsion_weight 要和 inflation_radius 联动；膨胀半径越大，该权重通常应越小。
      ObstaclesCritic:
        enabled: true
        cost_power: 1                    # 线性叠加障碍代价
        repulsion_weight: 2.2            # 一般远离障碍的权重；局部 inflation 加大后适当降低，避免过度保守
        critical_weight: 45.0            # 小于 collision_margin_distance 时的强惩罚权重
        collision_cost: 1000000.0        # 轨迹碰撞代价
        collision_margin_distance: 0.15  # 希望与障碍保持的最小额外距离，m；0.1~0.2 常见
        near_goal_distance: 0.6          # 靠近目标时减弱障碍排斥，防止目标贴墙时无法到点
        consider_footprint: false        # 与 CostCritic 一致，当前使用圆形半径模型
        inflation_layer_name: "inflation_layer"

      # 目标距离 critic：靠近目标时负责收敛到目标点。
      # threshold_to_consider 通常设置为预测距离附近，便于 PathFollow 与 GoalCritic 平滑交接。
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0                 # 官方示例值
        threshold_to_consider: 1.8       # 当前预测距离约 1.75m，因此设置为 1.8m

      # 目标朝向 critic：靠近目标时对齐最终 yaw；过大可能导致提前转向、前进变慢。
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5                 # 略低于官方 3.0，降低途中因目标朝向造成的转向干扰
        threshold_to_consider: 0.4       # 离目标 0.4m 内才强关注目标 yaw

      # 路径对齐 critic：鼓励候选轨迹贴合全局路径形状，但它本身不负责“往前走”。
      # 官方说明：过高会削弱绕障能力；过低会走得不贴全局路径。
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0                # 官方示例值；当前用于增强贴合全局路径
        max_path_occupancy_ratio: 0.08   # 路径上障碍占比过高时暂停路径对齐，让绕障 critic 接管
        trajectory_point_step: 4         # 每 4 个预测点评估一次，降低计算量
        threshold_to_consider: 0.6       # 离目标小于该距离时关闭路径对齐，交给目标 critic
        offset_from_furthest: 24         # 从候选轨迹最远到达路径点再向前取点；过大可能很晚才生效
        use_path_orientations: false     # Navfn 路径朝向意义弱，保持 false

      # 路径前进 critic：真正驱动机器人沿全局路径向前推进。
      # 当前预测距离约 1.75m。若全局路径分辨率约 0.05m，40 点接近 2m，偏高；
      # 这里降到 26，使其更早参与前向推进，同时仍比官方默认 5 更积极。
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 22.0                # 高于官方默认 5.0，鼓励更快沿路径前进
        offset_from_furthest: 26         # 40 对当前预测距离偏高，可能导致该 critic 很晚才充分生效
        threshold_to_consider: 1.8       # 与预测距离匹配，临近目标后让 GoalCritic 接管

      # 路径角度 critic：惩罚与路径方向夹角过大的轨迹，帮助转弯时顺着路径切入。
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.2                 # 官方默认值，适合抑制起步/转弯时的角度误差
        offset_from_furthest: 4          # 看路径前方较近的角度，避免过度预判远处弯
        threshold_to_consider: 0.5       # 靠近目标后关闭路径角度约束
        max_angle_to_furthest: 1.0       # 角度误差超过该值时更明显地考虑路径角度
        mode: 0                          # 0 表示偏好前进方向；vx_min=0 时应使用该模式

      # 前进偏好 critic：惩罚倒车。虽然 vx_min=0 已禁止倒车，保留该 critic 可增强正向偏好。
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0                # 高于官方 5.0，适合当前不允许倒车的实机策略
        threshold_to_consider: 0.5       # 接近目标后不再强推前进

      # 速度死区 critic：惩罚低于底盘可执行死区的速度，避免 MPPI 长期给很小速度。
      # 注意：该参数不是“高速奖励”，设置太高会导致速度跳变或贴障碍时仍想硬冲。
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0                # 中等权重，避免小速度抖动但不过度压过避障
        deadband_velocities: [0.18, 0.0, 0.0]  # [vx, vy, wz] 死区；差速底盘 vy 为 0

      # 自旋 critic：惩罚不必要的旋转。对差速车可低权重使用，减少起步/转弯时多余扭动。
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0                 # 低权重抑制多余旋转；过高会让急弯转向不足

# 局部代价地图：滚动窗口，服务于局部避障与控制
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0             # 更新频率，Hz
      publish_frequency: 10.0            # 发布频率，Hz
      global_frame: odom                 # 局部图挂在 odom 下，避免 map 抖动影响控制
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5                           # 局部地图宽度，m
      height: 5                          # 局部地图高度，m
      resolution: 0.05                  # 分辨率，m/cell
      # 改为圆形底盘模型：由 robot_radius 决定碰撞轮廓
      robot_radius: 0.25
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0         # 膨胀代价衰减速度
        inflation_radius: 0.35           # 障碍膨胀半径，m；需大于 MPPI 日志中的 circumscribed radius 0.264m
      obstacle_layer:
        # 本地障碍物输入统一来自 /scan
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True # 清除机器人足迹内部障碍
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          observation_persistence: 2.0
          tf_filter_tolerance: 0.3
          marking: True
          clearing: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      always_send_full_costmap: True     # 始终发布完整 costmap

# 全局代价地图：静态地图 + 实时障碍
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0              # 全局图更新频率通常低于局部图
      publish_frequency: 3.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true          # 保留未知区域
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        # 全局图同样使用 /scan 作为实时障碍输入
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        min_obstacle_height: -1.0
        max_obstacle_height: 2.0
        scan:
          topic: /scan
          data_type: "LaserScan"
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          marking: True
          clearing: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True  # 兼容 map_server 的 transient_local QoS
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0         # 膨胀代价衰减速度
        inflation_radius: 0.30           # 障碍膨胀半径，m
      always_send_full_costmap: True

# 地图保存器：运行时保存地图
map_saver:
  ros__parameters:
    save_map_timeout: 5.0                # 保存地图超时，s
    free_thresh_default: 0.25            # 自由空间阈值
    occupied_thresh_default: 0.65        # 占用空间阈值
    map_subscribe_transient_local: True

# 全局规划器：依据全局代价地图求路径
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0     # 期望规划频率，Hz
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5                     # 目标点附近允许落到最近可达点的距离
      use_astar: false                   # false 为 Dijkstra，true 为 A*
      allow_unknown: false               # 是否允许穿越未知区域

# 平滑器：对规划路径做轻量平滑
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# 恢复行为服务器：负责原地转向、后退、等待等恢复动作
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame:  odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# 路点跟随器：用于多目标点导航
waypoint_follower:
  ros__parameters:
    loop_rate: 20                        # 路点处理循环频率，Hz
    stop_on_failure: false               # 单点失败后是否整体终止
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200       # 到点后停留时间，ms

# 速度平滑器：当前试验版旁路，底盘直接订阅 /cmd_vel_nav，不再接入最终控制链路
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0            # 平滑频率，Hz
    scale_velocities: False
    feedback: "CLOSED_LOOP"              # 官方 bringup 仍会启动该节点，但 /cmd_vel_safe 不再使用它的输出
    max_velocity: [0.5, 0.0, 1.0]        # 最大速度 [vx, vy, wz]
    min_velocity: [-0.2, 0.0, -1.0]      # 最小速度 [vx, vy, wz]
    max_accel: [1.5, 0.0, 1.5]           # 最大加速度
    max_decel: [-1.5, 0.0, -1.5]         # 最大减速度
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]   # 死区速度
    velocity_timeout: 1.0                # 超时未收到速度则置零

# 碰撞监视器：当前试验版关闭，底盘直接使用 /cmd_vel_nav 作为速度输入
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: "cmd_vel_nav"      # 仅保留节点参数；底盘不再使用 collision_monitor 输出
    cmd_vel_out_topic: "cmd_vel_safe"    # 当前不会被底盘订阅
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: False
    observation_sources: ["obstacle_points"]
    obstacle_points:
      # 保持与 costmap 一致，统一消费 /scan
      type: "scan"
      topic: /scan
      enabled: False

# 停靠服务：当前沿用模板参数
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

# loopback_simulator：保留 Nav2 自带测试/模拟接口所需参数
loopback_simulator:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    map_frame_id: map
    # 这里使用 3D 雷达安装帧
    scan_frame_id: "lidar_3d_link"
    update_duration: 0.02
